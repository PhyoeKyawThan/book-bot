<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ template_data.title }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div id="app">
        <div class="header">
            <div class="logo">
                <img src="/static/images/logo.png" alt="" srcset="">
                <div class="logo-text">Book Store</div>
            </div>
            <div id="nav">
                |<a href="{{ url_for('index') }}" class="nav-item">Home</a>|
                <a href="" class="nav-item">Books</a>|
                <a href="" class="nav-item">Support</a>|
            </div>
        </div>
        <!-- books section -->
        <div id="view">
            {% block content %}
            {% endblock content %}</div>
        <!-- books section end -->
    </div>
    <!-- bot area -->
    <div id="chat-bot">
        <div id="icon">
            <img src="/static/images/icon.png" alt="" srcset="">
        </div>
        <div id="chat-area">
            <div id="close-chat-area">
                X
            </div>
            <div id="chat-heading">
                <div id="chat-avatar">
                    <img src="/static/images/icon.png" alt="" srcset="">
                </div>
                <div id="chat-bot-name">
                    <div>Book Bot</div>
                    <div id="status" class="status-active">Active</div>
                </div>
            </div>
            <div id="chat-conversation">
                <div id="message-from-bot">
                    <div id="avatar">
                        <img src="/static/images/icon.png" alt="" srcset="">
                    </div>
                    <div id="message">
                        Hello there, What can I help for you?<br>
                        <b>Frequent questions.. </b><br>
                        <ul>
                            <li>Is it able to buy with COD (Cash On Delivery)?</li>
                            <li>How long does it take to deliver?</li>
                        </ul>
                    </div>
                </div>

                <div id="message-from-client">
                    <div id="client-icon">
                        <img src="/static/images/client_icon.png" alt="" srcset="">
                    </div>
                    <div id="message">Who are u?Lore</div>
                </div>
            </div>
            <div id="chat-input">
                <input type="text" name="" id="" placeholder="What can I help you, today?">
                <button type="button">
                    <img src="/static/images/paper-plane.png" alt="" srcset="">
                </button>
            </div>
        </div>
    </div>
    <!-- bot area end -->

    <script src="/static/js/app.js"></script>
</body>

</html>
