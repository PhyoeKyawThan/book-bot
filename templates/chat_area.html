<script src="{{ url_for('static', filename='js/socket.io.js') }}"></script>
<script src="{{ url_for('static', filename='js/chat-socket.js') }}"></script>
<script>
    // const io = 
    chat_socket.socket = io("/bot", {
        autoConnect: false
    });
    const input = document.getElementById("chat-input-box");
    const btn = document.getElementById("send-btn");
    const conversation = document.getElementById("chat-conversation");
    const status = document.getElementById("status");
    const chatIcon = document.querySelector("#chat-bot #icon");
    const chatArea = document.getElementById("chat-area");
    const closeBtn = document.getElementById("close-chat-area");

    closeBtn.addEventListener("click", () => {
        chatIcon.style.display = "block";
        chatArea.style.display = "none";
        chat_socket.close();
    })

    chatIcon.addEventListener("click", (e) => {
        e.stopPropagation();
        chatIcon.style.display = "none";
        chatArea.style.display = "flex";
        chat_socket.open();
    });

    document.addEventListener("click", () => {
        chatIcon.style.display = "block";
        chatArea.style.display = "none";
        chat_socket.close();
    });

    chatArea.addEventListener("click", (e) => {
        e.stopPropagation();
    });

    btn.addEventListener("click", () => {
        const text = input.value.trim();
        if (!text) return;

        sendMessage(text);
        input.value = "";
    });

    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            btn.click();
        }
    });

    function statusActive() {
        status.classList.remove("status-offline");
        status.classList.add("status-active");
        status.innerText = "Active";
    }

    function statusDisconnected() {
        status.classList.add("status-offline");
        status.classList.remove("status-active");
        status.innerText = "Offline";
    }

    chat_socket.onConnect(() => {
        statusActive();
    });

    chat_socket.onDisconnect(() => {
        statusDisconnected();
    });

    chat_socket.onMessage((data) => {
        if (data?.is_typing) {
            addTyping();
            return;
        }

        removeTyping();
        addBotMessage(data?.response || "");
    });

    function sendMessage(text) {
        chat_socket.sendMessage(text);
        addClientMessage(text);
    }

    function addClientMessage(text) {
        const div = document.createElement("div");
        div.className = "message-from-client";
        div.innerHTML = `
        <div class="client-icon">
            <img src="/static/images/client_icon.png" alt="">
        </div>
        <div class="message">${escapeHTML(text)}</div>
    `;
        conversation.appendChild(div);
        scrollToBottom();
    }

    function addTyping() {
        if (document.getElementById("typing")) return;

        const div = document.createElement("div");
        div.id = "typing";
        div.className = "message-from-bot typing";
        div.innerHTML = `
        <div class="avatar">
            <img src="/static/images/icon.png" alt="">
        </div>
        <div class="message">Typing...</div>
    `;
        conversation.appendChild(div);
        scrollToBottom();
    }

    function removeTyping() {
        const typing = document.getElementById("typing");
        if (typing) typing.remove();
    }

    function addBotMessage(text) {
        const div = document.createElement("div");
        div.className = "message-from-bot";
        div.innerHTML = `
        <div class="avatar">
            <img src="/static/images/icon.png" alt="">
        </div>
        <div class="message">${escapeHTML(text)}</div>
    `;
        conversation.appendChild(div);
        scrollToBottom();
    }

    function scrollToBottom() {
        conversation.scrollTo({
            top: conversation.scrollHeight,
            behavior: "smooth"
        });
    }

    function escapeHTML(text) {
        return text.replace(/[&<>"']/g, m => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[m]));
    }

    function openChat() {
        chat_socket.open();
    }

    function closeChat() {
        chat_socket.close();
    }

    window.addEventListener("beforeunload", () => {
        chat_socket.close();
    });
</script>
